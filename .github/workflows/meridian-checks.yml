name: Meridian checks

on:
  workflow_dispatch:
  push:
    branches: [meridian-platform-v1]
    paths:
      - "meridian/**"
      - "render.yaml"
      - ".github/workflows/meridian-checks.yml"
  pull_request:
    paths:
      - "meridian/**"
      - "render.yaml"
      - ".github/workflows/meridian-checks.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        working-directory: meridian
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        working-directory: meridian
        run: python -m compileall -q app.py
      - name: Run safety tests
        working-directory: meridian
        run: pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate dashboard JavaScript
        run: node --check meridian/static/app.js
