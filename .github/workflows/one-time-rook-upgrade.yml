name: Deploy prepared Rook model

on:
  push:
    paths:
      - ".github/workflows/one-time-rook-upgrade.yml"

permissions:
  contents: write

jobs:
  merge-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch and validate upgraded checkpoint
        env:
          MODEL_ZIP_URL: https://6a35086a-a546-4d8f-8e00-7539ee219f79.sandbox.floot.app/_cdn/static/4c17be77-d90b-4121-a627-230fe32e7423-rook-upgraded-app.zip
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$MODEL_ZIP_URL" --output /tmp/rook-upgrade.zip
          python - <<'PY'
          import json, re, zipfile
          from pathlib import Path

          current_path = Path("index.html")
          current = current_path.read_text(encoding="utf-8")
          with zipfile.ZipFile("/tmp/rook-upgrade.zip") as z:
              upgraded = z.read("index.html").decode("utf-8")

          pattern = re.compile(r'(<script id="rook-model" type="application/json">)([\s\S]*?)(</script>)')
          current_match = pattern.search(current)
          upgraded_match = pattern.search(upgraded)
          if not current_match or not upgraded_match:
              raise SystemExit("Model payload not found in both app builds.")

          old_model = json.loads(current_match.group(2))
          new_model = json.loads(upgraded_match.group(2))
          if old_model.get("config") != new_model.get("config"):
              raise SystemExit("Model configuration mismatch; deployment cancelled.")
          if old_model.get("merges") != new_model.get("merges"):
              raise SystemExit("Tokenizer mismatch; deployment cancelled.")
          if old_model.get("weights") == new_model.get("weights"):
              raise SystemExit("New weights match existing weights; deployment cancelled.")

          merged = current[:current_match.start(2)] + upgraded_match.group(2) + current[current_match.end(2):]
          if "function conversationalReply" in merged:
              raise SystemExit("Found scripted conversational layer; deployment cancelled.")
          if not re.search(r'const reply=generate\(prompt,60\);', merged):
              raise SystemExit("Direct model generation check failed.")
          current_path.write_text(merged, encoding="utf-8")
          print(f"Embedded new model weights into existing app; preserved existing interface. HTML bytes: {len(merged.encode())}.")
          PY
      - name: Commit model update and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/one-time-rook-upgrade.yml
          git commit -m "Deploy upgraded Rook model checkpoint"
          git push origin HEAD:main
