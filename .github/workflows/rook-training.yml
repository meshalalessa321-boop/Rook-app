name: Rook Brain Training

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/rook-training.yml"
      - "training/rook_brain.py"
      - "training/prepare_wikitext.py"
      - "training/test_rook_brain.py"
      - "training/requirements.txt"
      - "training/corpus/**"

permissions:
  contents: read

concurrency:
  group: rook-brain-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out Rook
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements.txt

      - name: Restore Rook Brain checkpoints and dataset cache
        uses: actions/cache/restore@v4
        with:
          path: |
            training/artifacts/rook-brain
            ~/.cache/huggingface/datasets
            ~/.cache/huggingface/hub
          key: rook-brain-state-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            rook-brain-state-v1-${{ runner.os }}-

      - name: Install training dependencies
        run: python -m pip install -r training/requirements.txt

      - name: Prepare documented language corpus
        run: python training/prepare_wikitext.py

      - name: Run training pipeline tests
        run: python -m unittest discover -s training -v

      - name: Audit corpus and provenance
        run: python training/rook_brain.py --audit-only

      - name: Train Rook from random initialization or resume his own checkpoint
        run: python training/rook_brain.py --steps 500 --ctx 256 --batch 4

      - name: Save Rook Brain checkpoints and dataset cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            training/artifacts/rook-brain
            ~/.cache/huggingface/datasets
            ~/.cache/huggingface/hub
          key: rook-brain-state-v1-${{ runner.os }}-${{ github.run_id }}

      - name: Upload training report
        if: always() && hashFiles('training/artifacts/rook-brain/report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: rook-brain-report-${{ github.run_number }}
          path: |
            training/artifacts/rook-brain/report.json
            training/artifacts/rook-brain/corpus_audit.json
            training/artifacts/rook-brain/dataset_manifest.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload best checkpoint
        if: success() && hashFiles('training/artifacts/rook-brain/best.pt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: rook-brain-checkpoint-${{ github.run_number }}
          path: training/artifacts/rook-brain/best.pt
          if-no-files-found: error
          retention-days: 30
