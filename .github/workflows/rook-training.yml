name: Rook Brain Training

on:
  workflow_dispatch:
  schedule:
    # Every 6 hours (00:17, 06:17, 12:17, 18:17 UTC). A run takes about 3-4 hours, and the
    # concurrency group below queues a run that starts while another is still going.
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/rook-training.yml"
      - "training/rook_brain.py"
      - "training/rook_tokenizer.py"
      - "training/train_rook_next.py"
      - "training/export_rook_brain_onnx.py"
      - "training/prepare_wikitext.py"
      - "training/prepare_tinystories.py"
      - "training/prepare_dialogue.py"
      - "training/test_rook_brain.py"
      - "training/requirements.txt"
      - "training/corpus/**"

permissions:
  contents: write

concurrency:
  group: rook-brain-training
  # Never terminate a costly training run just because a follow-up commit arrives.
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out Rook
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements.txt

      - name: Restore Rook Brain checkpoints and dataset cache
        uses: actions/cache/restore@v4
        with:
          path: |
            training/artifacts/rook-brain
            ~/.cache/huggingface/datasets
            ~/.cache/huggingface/hub
          key: rook-brain-state-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            rook-brain-state-v2-${{ runner.os }}-

      - name: Install training dependencies
        run: python -m pip install -r training/requirements.txt onnx onnxruntime numpy

      - name: Prepare documented language corpus
        run: python training/prepare_wikitext.py

      - name: Add documented simple English stories (TinyStories)
        run: python training/prepare_tinystories.py --max-stories 200000

      - name: Add everyday human dialogue (DailyDialog, neutral Person A / Person B labels)
        run: python training/prepare_dialogue.py

      - name: Run training pipeline tests
        run: python -m unittest discover -s training -v

      - name: Audit corpus and provenance
        run: python training/rook_brain.py --audit-only

      - name: Smoke-test train, tokenizer, ONNX export and generation on a small slice
        shell: bash
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/rook-smoke"
          python training/rook_brain.py --smoke --out-dir "$SMOKE"
          python training/export_rook_brain_onnx.py --checkpoint "$SMOKE/best.pt" \
            --model-out "$SMOKE/model.onnx" --manifest-out "$SMOKE/brain.json" \
            --tokenizer-out "$SMOKE/tokenizer.json"
          test -s "$SMOKE/tokenizer.json"

      - name: Select resume mode for this exact corpus
        id: resume
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          import sys
          from pathlib import Path
          import torch

          sys.path.insert(0, "training")
          from rook_brain import load_documents

          docs, _ = load_documents()
          fingerprint = hashlib.sha256(
              "".join(sorted(doc["sha256"] for doc in docs)).encode("ascii")
          ).hexdigest()
          resume = Path("training/artifacts/rook-brain/resume.pt")
          old_fingerprint = None
          if resume.is_file():
              saved = torch.load(resume, map_location="cpu", weights_only=False)
              old_fingerprint = saved.get("corpus_fingerprint")
          # A changed or legacy-unfingerprinted corpus starts a fresh model.
          # Matching corpus fingerprints continue training from Rook's own weights.
          print("fresh=" + ("true" if resume.is_file() and old_fingerprint != fingerprint else "false"))
          PY

      - name: Train Rook from random initialization or resume his own checkpoint
        shell: bash
        run: |
          set -euo pipefail
          args=(--steps 2000 --ctx 256 --batch 8)
          if [[ "${{ steps.resume.outputs.fresh }}" == "true" ]]; then
            args+=(--fresh)
            echo "Corpus changed: starting a new random-initialized checkpoint lineage."
          fi
          python training/rook_brain.py "${args[@]}"

      # Do not run assistant-response fine-tuning here. It reintroduces the
      # answer-only objective this from-scratch full-sequence pipeline replaces.

      - name: Export and test the exact Rook Brain checkpoint trained in this run
        run: python training/export_rook_brain_onnx.py

      - name: Save Rook Brain checkpoints and dataset cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            training/artifacts/rook-brain
            ~/.cache/huggingface/datasets
            ~/.cache/huggingface/hub
          key: rook-brain-state-v2-${{ runner.os }}-${{ github.run_id }}

      - name: Upload training report
        if: always() && hashFiles('training/artifacts/rook-brain/report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: rook-brain-report-${{ github.run_number }}
          path: |
            training/artifacts/rook-brain/report.json
            training/artifacts/rook-brain/corpus_audit.json
            training/artifacts/rook-brain/dataset_manifest.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload best checkpoint
        if: success() && hashFiles('training/artifacts/rook-brain/best.pt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: rook-brain-checkpoint-${{ github.run_number }}
          path: training/artifacts/rook-brain/best.pt
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified model as a stable browser-download release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="rook-brain-latest"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Rook Brain browser model" --notes "Automatically updated, runtime-verified browser export of Rook's from-scratch checkpoint. No pretrained weights or external inference API."
          fi
          gh release upload "$TAG" models/rook-brain.onnx rook-status/brain.json rook-status/tokenizer.json --clobber

      - name: Publish browser model on a stable raw-content branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/rook-model-publish
          cp models/rook-brain.onnx /tmp/rook-model-publish/rook-brain.onnx
          cp rook-status/brain.json /tmp/rook-model-publish/brain.json
          cp rook-status/tokenizer.json /tmp/rook-model-publish/tokenizer.json
          git checkout --orphan rook-model-publish
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/rook-model-publish/rook-brain.onnx ./rook-brain.onnx
          cp /tmp/rook-model-publish/brain.json ./brain.json
          cp /tmp/rook-model-publish/tokenizer.json ./tokenizer.json
          git add rook-brain.onnx brain.json tokenizer.json
          git commit -m "Publish latest verified Rook browser model"
          git push --force origin HEAD:rook-model
