name: Rook 24-7 Training Worker

on:
  push:
    branches: [main]
    paths:
      - "training/**"
      - ".github/workflows/rook-training.yml"
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rook-training-worker
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out Rook
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements.txt

      - name: Restore latest training state and dataset cache
        uses: actions/cache/restore@v4
        with:
          path: |
            artifacts/rook-next
            ~/.cache/huggingface/datasets
            ~/.cache/huggingface/hub
          key: rook-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            rook-state-${{ runner.os }}-

      - name: Install training dependencies
        run: python -m pip install -r training/requirements.txt

      - name: Run pipeline tests
        working-directory: training
        run: python -m unittest discover -v

      - name: Train Rook and checkpoint progress
        id: train-rook
        run: python training/rook_worker.py --max-runtime-seconds 19800 --ctx 256 --batch 2 --save-every 25 --eval-every 100

      - name: Publish verified progress snapshot
        if: success() && hashFiles('artifacts/rook-next/report.json') != ''
        run: |
          mkdir -p rook-status
          cp artifacts/rook-next/report.json rook-status/latest.json
          cp artifacts/rook-next/dataset_manifest.json rook-status/dataset_manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rook-status/latest.json rook-status/dataset_manifest.json
          if git diff --cached --quiet; then
            echo "Progress snapshot unchanged."
          else
            git commit -m "Record Rook training progress"
            git push
          fi

      - name: Save training state for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            artifacts/rook-next
            ~/.cache/huggingface/datasets
            ~/.cache/huggingface/hub
          key: rook-state-${{ runner.os }}-${{ github.run_id }}

      - name: Upload Rook's progress report
        if: always() && hashFiles('artifacts/rook-next/report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: rook-progress-${{ github.run_number }}
          path: |
            artifacts/rook-next/report.json
            artifacts/rook-next/dataset_manifest.json
          if-no-files-found: ignore
          retention-days: 30
