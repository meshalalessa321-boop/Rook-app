name: Meridian Engineering Partner

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: meridian-engineering-partner
  cancel-in-progress: false

jobs:
  review-and-propose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements.txt

      - name: Run Meridian
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ROOK_ENGINEER_MODEL: gpt-6.1-sol
        run: python3 rook-engineer/agent.py

      - name: Upload Meridian report and patch
        if: always() && hashFiles('rook-engineer-report.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: meridian-engineering-report
          path: rook-engineer-report.md
          retention-days: 30
